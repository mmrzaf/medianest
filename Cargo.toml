[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["mmrzaf <mohammr.farkhonde12@sharif.edu>"]
repository = "https://github.com/mmrzaf/medianest"
homepage = "https://github.com/mmrzaf/medianest"

[workspace.dependencies]
medianest-core = { path = "crates/medianest-core" }
medianest-catalog = { path = "crates/medianest-catalog" }
medianest-media = { path = "crates/medianest-media" }
medianest-vault = { path = "crates/medianest-vault" }
medianest-service = { path = "crates/medianest-service" }

async-channel = "2"
blake3 = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-channel = "0.3"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
libheif-rs = { version = "2", default-features = false, features = ["v1_19"] }
notify = { version = "8", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
trash = "5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
